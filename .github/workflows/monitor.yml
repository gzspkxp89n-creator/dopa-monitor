name: DOPAガチャ監視

on:
  schedule:
    # 15分ごとに自動実行（GitHubの混雑で数分ずれることがあります）
    - cron: "*/15 * * * *"
  workflow_dispatch:   # 「Run workflow」ボタンで手動実行もできる

permissions:
  contents: write      # state.json（前回の状態）をリポジトリに保存するために必要

concurrency:
  group: dopa-monitor  # 前の実行が終わるまで次を待つ（二重実行防止）
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリ導入
        run: pip install requests

      - name: 巡回実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DOPA_DISCORD_WEBHOOK }}
          KEYWORDS: ${{ vars.DOPA_KEYWORDS }}
        run: python monitor_gh.py

      - name: 状態を保存（差分があればコミット）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: 監視状態を更新"
          git pull --rebase || true
          git push
